# CI for this archive: compiles, lints, loads every cog into a real Bot, and
# drives the change-stream watchers against a real MongoDB replica set.
#
# Deliberately NOT run here: tools/live_smoketest.py. It logs the actual bot
# into Discord and would need a live token in repo secrets - not something to
# do unattended on every push to an archived project. Run it by hand; see
# README.md's Verification section.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Compile check
        run: python -m compileall -q .

      - name: Lint (undefined names, bad star-imports, syntax)
        run: ruff check --select F821,F403,F405,E9 .

      - name: Load every cog into a real Bot
        env:
          DISCORD_TOKEN: dummy
          STEAM_API_KEY: dummy
          # Deliberately unreachable: motor connects lazily, so cog loading
          # and command registration never has to touch a real database.
          MONGODB_URI: "mongodb://127.0.0.1:1/?directConnection=true&serverSelectionTimeoutMS=200"
        run: python3 tools/load_check.py

      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.runCommand('ping')" >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval \
            "rs.initiate({_id:'rs0', members:[{_id:0, host:'127.0.0.1:27017'}]})"
          for i in $(seq 1 30); do
            state=$(docker exec mongo mongosh --quiet --eval "rs.status().members[0].stateStr" 2>/dev/null)
            [ "$state" = "PRIMARY" ] && break
            sleep 1
          done

      - name: Verify the slot-worker change-stream watchers
        env:
          DISCORD_TOKEN: dummy
          STEAM_API_KEY: dummy
          MONGODB_URI: "mongodb://127.0.0.1:27017/?directConnection=true"
        run: python3 tools/test_change_streams.py
